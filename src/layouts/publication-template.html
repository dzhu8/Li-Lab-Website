<!-- Reusable publication markup.

     publications.html fetches this file, parses it, and clones the templates
     below. Only the <template> elements are read — a <style> block here would
     be discarded, so all publication styling lives in publications.html. -->
<template id="publication-template">
     <div class="pub">
          <div class="pub-image" aria-hidden="true">
               <!-- rectangular placeholder for publication thumbnail -->
          </div>
          <div class="pub-text">
               <h4 class="pub-title">Publication Title</h4>
               <!-- Filled as a single "Journal, date (PubMed: ...)" line by addPublication(). -->
               <p class="pub-meta"></p>
               <p class="pub-authors">Authors list</p>
               <p class="pub-desc">Short description or citation snippet goes here.</p>
          </div>
     </div>
</template>

<template id="citation-template">
     <div class="citation-entry">
          <p class="citation-content"></p>
     </div>
</template>
