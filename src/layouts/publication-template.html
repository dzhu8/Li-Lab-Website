<!-- Reusable publication template -->
<template id="publication-template">
    <div class="pub">
        <div class="pub-image" aria-hidden="true">
            <!-- rectangular placeholder for publication thumbnail -->
        </div>
        <div class="pub-text">
            <h4 class="pub-title">Publication Title</h4>
                <p class="pub-meta"><span class="pub-journal">Journal title</span><span class="sep">, </span><span class="pub-date">Publication date</span></p>
                <p class="pub-authors">Authors list</p>
            <p class="pub-desc">Short description or citation snippet goes here.</p>
        </div>
    </div>
</template>

<style>
/* Minimal styles to match publications page */
.pub { display: grid; grid-template-columns: 800px 1fr; gap: 2rem; align-items:center; margin:2rem 0; }
.pub-image { width:800px; height:800px; background:#ffffff; display:flex; align-items:center; justify-content:center; color:#666; font-size:14px; box-shadow:0 8px 20px rgba(0,0,0,0.08); overflow:hidden; }
.pub-text .pub-title { margin:0 0 0.5rem 0; }
.pub-text .pub-desc { margin:0; color:#444; }
.pub-meta { margin:0 0 0.25rem 0; color:#666; font-size:0.95rem; }
.pub-link { margin:0.25rem 0 0 0; }
.pub-link__a { color: #0b66c3; text-decoration: none; }
.pub-link__a:hover { text-decoration: underline; }
@media (max-width:768px) {.pub { grid-template-columns: 1fr; text-align:center; } .pub-image { width:80%; height:auto; aspect-ratio: 1 / 1; margin: 0 auto; }}

/* Make img or object fill the thumbnail */
.pub-image img, .pub-image object, .pub-image embed { width: 100%; height: 100%; object-fit: cover; display:block; }
</style>
