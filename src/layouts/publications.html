<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Li Lab | Publications</title>
          <link rel="stylesheet" href="../css/header.css" />
          <style>
               body {
                    font-family: "Avenir Next", sans-serif;
                    margin: 0;
                    padding: 0;
                    color: #222;
               }
               /* Expanded max-width so 800px image + text don't get cramped */
               main {
                    padding: calc(80px + 2rem) 6vw 4rem;
                    max-width: 1600px;
                    margin: 0 auto;
               }
               h1,
               h2 {
                    color: #111;
               }
               h3 {
                    font-size: 2.4rem;
               }
               .section {
                    margin-bottom: 3rem;
               }
               .main-section-header {
                    font-size: 2.8rem;
                    margin-top: 4rem;
                    margin-bottom: 2rem;
                    border-bottom: 2px solid #eee;
                    padding-bottom: 0.5rem;
               }
               /* Publications layout: two entries per row, image above its text */
               .pub-list {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: 3rem 2.5rem;
                    margin-top: 2rem;
               }
               .pub {
                    margin: 0;
               }
               .pub-image {
                    width: 100%;
                    height: 400px;
                    background: #ffffff;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #666;
                    font-size: 14px;
                    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
                    overflow: hidden;
                    margin-bottom: 1.25rem;
               }
               /* Ensure images or embedded objects fill the container without distortion */
               .pub-image img,
               .pub-image object,
               .pub-image embed {
                    width: 100%;
                    height: 100%;
                    display: block;
                    object-fit: cover; /* use contain if you prefer letterboxing instead of cropping */
               }
               /* Ensure the anchor wrapper fills the container so its child can cover */
               .pub-image > a {
                    width: 100%;
                    height: 100%;
                    display: block;
               }
               .pub-title {
                    margin: 0 0 0.5rem 0;
               }
               .pub-desc {
                    margin: 0;
                    color: #444;
               }

               /* Offset publications to the right compared to the year heading */
               .pub-year {
                    position: relative;
               }
               .pub-year .pub-list {
                    margin-left: 3.2rem;
               }

               /* Slightly smaller meta text */
               .pub-meta {
                    margin: 0 0 0.25rem 0;
                    color: #666;
                    font-size: 0.95rem;
               }
               .pub-link__a {
                    color: #0b66c3;
                    text-decoration: none;
               }
               .pub-link__a:hover {
                    text-decoration: underline;
               }

               @media (max-width: 1000px) {
                    /* Single column, and drop the offset */
                    .pub-list {
                         grid-template-columns: 1fr;
                    }
                    .pub {
                         text-align: center;
                    }
                    .pub-image {
                         height: 300px;
                    }
                    .pub-year .pub-list {
                         margin-left: 0;
                    }
                    
                    /* Mobile Menu Styles (copied from header.css/home.html logic if not present in header.css) */
                    /* Since header.css handles the nav styles, we just need the toggle button styles if not in header.css */
                    /* We added .header__toggle to header.css, so it should work if linked. */
               }
          </style>
     </head>
     <body>
          <header class="header">
               <div class="header__content">
                    <div class="header__logo">
                         <div class="header__logo-circle">
                              <span>Temp.<br />Logo</span>
                         </div>
                         <div class="header__logo-text">
                              <h1>Li Lab</h1>
                              <p class="subtitle">@Whitehead Institute & MIT</p>
                         </div>
                    </div>
                    <div class="header__toggle" id="mobile-menu-toggle">
                         <span></span>
                         <span></span>
                         <span></span>
                    </div>
                    <nav class="header__nav" id="header-nav">
                         <ul class="header__nav-list">
                              <li><a href="home.html">Home</a></li>
                              <li><a href="research.html">Research</a></li>
                              <li><a href="home.html#news">Lab News</a></li>
                              <li><a href="about.html">About Us</a></li>
                              <li><a href="publications.html">Publications</a></li>
                         </ul>
                    </nav>
               </div>
          </header>

          <main>
               <section id="highlighted-publications" class="section">
                    <h2 class="main-section-header">Highlighted Publications</h2>
                    <div id="years-list"></div>
               </section>

               <section id="current-research-publications" class="section">
                    <h2 class="main-section-header">Publications Related to Current Research</h2>
                    <div id="current-research-list"></div>
               </section>

               <section id="previous-publications" class="section">
                    <h2 class="main-section-header">Previous Publications</h2>
                    <div id="previous-publications-list"></div>
               </section>
          </main>

          <script>
               // Generate publication entries
               (async function () {
                    const container = document.getElementById("years-list");
                    const currentResearchContainer = document.getElementById("current-research-list");
                    const previousPublicationsContainer = document.getElementById("previous-publications-list");

                    // Fetch publication template and use it for each entry
                    try {
                         const tmplResp = await fetch("publication-template.html");
                         const tmplText = await tmplResp.text();
                         const parser = new DOMParser();
                         const tmplDoc = parser.parseFromString(tmplText, "text/html");
                         const pubTmpl = tmplDoc.querySelector("#publication-template");
                         const citationTmpl = tmplDoc.querySelector("#citation-template");

                         // Helper: ensure a section for the year exists (create or find)
                         const ensureYearSection = (year) => {
                              year = Number(year);
                              let sec = container.querySelector(`.pub-year[data-year="${year}"]`);
                              if (!sec) {
                                   sec = document.createElement("section");
                                   sec.className = "pub-year section";
                                   sec.setAttribute("data-year", year);
                                   const h3 = document.createElement("h3");
                                   h3.textContent = year;
                                   sec.appendChild(h3);

                                   // Entries live in their own grid so the year heading
                                   // is not itself a column
                                   const list = document.createElement("div");
                                   list.className = "pub-list";
                                   sec.appendChild(list);

                                   // Insert in descending order (higher year first)
                                   const existing = Array.from(container.querySelectorAll(".pub-year"));
                                   let inserted = false;
                                   for (const ex of existing) {
                                        const ey = parseInt(ex.getAttribute("data-year"), 10);
                                        if (ey < year) {
                                             container.insertBefore(sec, ex);
                                             inserted = true;
                                             break;
                                        }
                                   }
                                   if (!inserted) container.appendChild(sec);
                              }
                              return sec;
                         };

                         // Helper: add a publication object to a year section using the template
                         const addPublication = (opts) => {
                              // opts: { year, title, journal, authors, date, desc, imgText }
                              const year = opts.year || 2025;
                              const targetSection = ensureYearSection(year);
                              const clone2 = pubTmpl.content.cloneNode(true);
                              const pubEl2 = clone2.querySelector(".pub");
                              if (!pubEl2) return;
                              const titleEl2 = pubEl2.querySelector(".pub-title");
                              const metaEl2 = pubEl2.querySelector(".pub-meta");
                              const journalEl2 = pubEl2.querySelector(".pub-journal");
                              const authorsEl2 = pubEl2.querySelector(".pub-authors");
                              const dateEl2 = pubEl2.querySelector(".pub-date");
                              const descEl2 = pubEl2.querySelector(".pub-desc");
                              const imgEl2 = pubEl2.querySelector(".pub-image");
                              if (titleEl2) titleEl2.textContent = opts.title || "Untitled publication";
                              // Build a meta line: journal, date
                              const journalText = (opts.journal || "").trim();
                              const dateText = (opts.date || "").trim();
                              if (metaEl2) {
                                   if (journalText && dateText) metaEl2.textContent = journalText + ", " + dateText;
                                   else if (journalText) metaEl2.textContent = journalText;
                                   else if (dateText) metaEl2.textContent = dateText;
                                   else metaEl2.textContent = "";
                              }
                              if (journalEl2) journalEl2.textContent = "";
                              if (authorsEl2) authorsEl2.textContent = opts.authors || "";
                              if (dateEl2) dateEl2.textContent = "";
                              if (descEl2) descEl2.textContent = opts.desc || "";
                              // Render thumbnail: an image when opts.imgUrl is given, otherwise an
                              // empty container awaiting artwork. The whole container links to the
                              // paper when opts.pdf is provided.
                              if (imgEl2) {
                                   // clear existing placeholder content
                                   imgEl2.textContent = "";
                                   const imgUrl = opts.imgUrl ? String(opts.imgUrl).trim() : "";
                                   const pdf = opts.pdf ? String(opts.pdf).trim() : "";

                                   let holder = imgEl2;
                                   if (pdf) {
                                        // The template marks the container decorative; a focusable
                                        // link inside it must not be hidden from screen readers.
                                        imgEl2.removeAttribute("aria-hidden");
                                        const a = document.createElement("a");
                                        a.href = pdf;
                                        a.target = "_blank";
                                        a.rel = "noopener";
                                        a.setAttribute("aria-label", opts.title || "View publication PDF");
                                        imgEl2.appendChild(a);
                                        holder = a;
                                   }

                                   if (imgUrl) {
                                        const im = document.createElement("img");
                                        im.src = imgUrl;
                                        im.alt = opts.title || "Publication image";
                                        holder.appendChild(im);
                                   }
                              }

                              // Embed link (PubMed or URL) parenthesized into the meta line if provided
                              const pmid = opts.pmid ? String(opts.pmid).trim() : "";
                              const link = opts.link ? String(opts.link).trim() : "";
                              if (metaEl2) {
                                   // remove any existing trailing link node if present (defensive)
                                   const existingLinkSpan = metaEl2.querySelector(".pub-meta-link");
                                   if (existingLinkSpan) existingLinkSpan.remove();
                                   if (pmid || link) {
                                        const sep = document.createTextNode(" ");
                                        const parenOpen = document.createTextNode("(");
                                        const parenClose = document.createTextNode(")");
                                        const linkSpan = document.createElement("span");
                                        linkSpan.className = "pub-meta-link";
                                        if (pmid) {
                                             const a = document.createElement("a");
                                             a.href =
                                                  "https://pubmed.ncbi.nlm.nih.gov/" + encodeURIComponent(pmid) + "/";
                                             a.target = "_blank";
                                             a.rel = "noopener";
                                             a.textContent = "PubMed: " + pmid;
                                             a.className = "pub-link__a";
                                             linkSpan.appendChild(a);
                                        } else {
                                             const a = document.createElement("a");
                                             a.href = link;
                                             a.target = "_blank";
                                             a.rel = "noopener";
                                             a.textContent = "Link";
                                             a.className = "pub-link__a";
                                             linkSpan.appendChild(a);
                                        }
                                        // append ' (Link)'
                                        metaEl2.appendChild(sep);
                                        metaEl2.appendChild(parenOpen);
                                        metaEl2.appendChild(linkSpan);
                                        metaEl2.appendChild(parenClose);
                                   }
                              }
                              targetSection.querySelector(".pub-list").appendChild(pubEl2);
                         };

                         // Helper: add a citation-style publication
                         const addCitationPublication = (opts, targetContainer) => {
                              // opts: { authors, title, journal, year, link, pmid }
                              if (!targetContainer || !citationTmpl) return;
                              
                              const clone = citationTmpl.content.cloneNode(true);
                              const contentEl = clone.querySelector(".citation-content");
                              
                              if (contentEl) {
                                   // Format authors: bold "Li P"
                                   let authorsHtml = (opts.authors || "").replace(/Li P/g, "<strong>Li P</strong>");
                                   
                                   // Format journal: italicize known journals or just the journal field
                                   let journalHtml = opts.journal ? `<em>${opts.journal}</em>` : "";
                                   
                                   // Construct the HTML
                                   // Format: Authors. Title. Journal Year; Link
                                   
                                   let html = `${authorsHtml}. ${opts.title}. `;
                                   if (journalHtml) html += `${journalHtml} `;
                                   if (opts.year) html += `${opts.year}; `;
                                   
                                   // Link or PMID
                                   if (opts.pmid) {
                                        html += `<a href="https://pubmed.ncbi.nlm.nih.gov/${opts.pmid}/" class="citation-link pubmed-link" target="_blank" rel="noopener">PMID: ${opts.pmid}</a>`;
                                   } else if (opts.link) {
                                        html += `<a href="${opts.link}" class="citation-link" target="_blank" rel="noopener">${opts.link}</a>`;
                                   }
                                   
                                   contentEl.innerHTML = html;
                              }
                              targetContainer.appendChild(clone);
                         };

                         const addCurrentResearchPublication = (opts) => {
                              addCitationPublication(opts, currentResearchContainer);
                         };

                         const addPreviousPublication = (opts) => {
                              addCitationPublication(opts, previousPublicationsContainer);
                         };

                         // Add publications for 2026
                         addPublication({
                              year: 2026,
                              title: "Mechanistic tradeoffs between local and long-range signaling activity in natural and synthetic morphogens",
                              journal: "bioRxiv",
                              authors: "Gavin Schlissel, Anders S. Hansen, Pulin Li",
                              date: "February 9, 2026",
                              desc: "Hedgehog family morphogens have dual-lipid modifications: a palmitate and cholesterol. Here, we isolated the distinct contribution of each lipid modification to Hedgehog diffusion and signaling potency, finding that the palmitate promotes receptor engagement while the cholesterol confines secreted morphogens at the cell surface, enriching ligands locally at the cost of restricting long-range diffusion. This points to a tradeoff between signaling potency and gradient formation for Hedgehog-family morphogens.",
                              imgText: "Hedgehog modifications",
                              pdf: "../assets/papers/schlissel-et-al-2026.pdf",
                         });

                         // Add publications for 2025
                         addPublication({
                              year: 2025,
                              title: "A tissue-scale strategy for sensing threats in barrier organs",
                              journal: "bioRxiv",
                              authors: "Diep H. Nguyen, Jiakun Tian, Sean-Luc Shanahan, Connie Kangni Wang, Tyler Jacks, Xiao Wang, Pulin Li",
                              date: "March 19, 2025",
                              desc: "Here, by analyzing influenza infection in the lung using single-molecule imaging and spatial transcriptomics, we discovered a tiered threat-sensing strategy at the tissue scale, where the probability of detecting and responding to infection is lowest in the outermost epithelia and highest in the inner stroma. This strategy emerges from spatially graded PRR expression that results in cell-type-specific probabilities of threat-sensing across the tissue, a design broadly adopted by barrier organs. Selectively increasing PRR expression in lung epithelia in vivo exacerbated tissue damage upon inflammatory challenge. These results reveal a spatially tiered strategy to tolerate threats restricted within the epithelia, and yet enable progressively potent immune responses as threats invade deeper into the tissue.",
                              imgText: "Tiered sensing",
                              pdf: "../assets/papers/nguyen-et-al-2025.pdf",
                              pmid: "40166266"
                         });

                         addPublication({
                              year: 2025,
                              title: "Reconstructing signaling histories of single cells via perturbation screens and transfer learning",
                              journal: "bioRxiv",
                              authors: "Nicholas T. Hutchins, Miram Meziane, Claire Lu, Maisam Mitalipova, David Fischer, Pulin Li",
                              date: "March 17, 2025",
                              desc: "Here, we present an integrated experimental-computational framework that learns signaling response signatures from a high-throughput in vitro perturbation atlas and infers combinatorial signaling activities in in vivo cell types. We generated signaling perturbation atlas across diverse cell types/states through multiplexed sequential combinatorial screens on human pluripotent stem cells. Using the atlas to train IRIS, a neural networkbased model, and predicting on mouse embryo scRNAseq atlas, we discovered global features of combinatorial signaling code usage over time, identified biologically meaningful heterogeneity of signaling states within each cell type, and reconstructed signaling histories along diverse cell lineages.",
                              imgText: "IRIS",
                              pdf: "../assets/papers/hutchins-et-al-2025.pdf",
                              pmid: "40166200"
                         });

                         // Add publications for 2024
                         addPublication({
                              year: 2024,
                              title: "Diffusion barriers imposed by tissue topology shape Hedgehog morphogen gradients",
                              journal: "PNAS",
                              authors: "Gavin Schlissel, Miram Meziane, Domenic Narducci, Anders S. Hansen, Pulin Li",
                              date: "July 15, 2024",
                              desc: "Here,we used single-molecule imaging in reconstituted morphogen gradients and in tissue explants to determine that Hedgehog diffused extracellularly as a monomer, and rapidly transitioned between membrane-confined and -unconfined states. SCUBE1 expanded Hedgehog gradients by accelerating the transition rates between states without affecting the relative abundance of molecules in each state, supporting a opology-limited diffusion model inwhich cell–cell gaps create diffusion barriers, which Hedgehog can only overcome bypassing through a membrane-unconfined state aided by SCUBE1.",
                              pdf: "../assets/papers/schlissel-et-al-2024.pdf",
                              imgText: "Hedgehog diffusion",
                              pmid: "39190357",
                         });

                         // Add Relevant-to-Current-Research Publications
                         addCurrentResearchPublication({
                              authors: "Nguyen DH, Tian J, Shanahan S, Wang CK, Jacks T, Wang X, Li P",
                              title: "A tissue-scale strategy for sensing threats in barrier organs",
                              journal: "bioRxiv",
                              year: "2025",
                              pmid: "40166266"
                         });

                         addCurrentResearchPublication({
                              authors: "Hutchins NT, Meziane M, Lu C, Mitalipova M, Fischer D, Li P",
                              title: "Reconstructing signaling histories of single cells via perturbation screens and transfer learning",
                              journal: "bioRxiv",
                              year: "2025",
                              pmid: "40166200"
                         });

                         addCurrentResearchPublication({
                              authors: "Wallach LA, Thomas CD, Li P",
                              title: "Synthetically programming natural cell–cell communication pathways for tissue engineering",
                              journal: "Curr. Opin. Biomed. Eng.",
                              year: "2024; 32: 100554"
                         });

                         addCurrentResearchPublication({
                              authors: "Schlissel G, Meziane M, Narducci D, Hansen AS, Li P",
                              title: "Diffusion barriers imposed by tissue topology shape Hedgehog morphogen gradients",
                              journal: "Proc Natl Acad Sci U S A",
                              year: "2024; 121(36):e2400677121",
                              pmid: "39190357"
                         });

                         addCurrentResearchPublication({
                              authors: "Collins ZM, Cha A., Qin A, Ishimatsu K, Tsai TYC, Swinburne IA, Li P, Megason SG",
                              title: "Scube2-Shh feedback loop links morphogen release and spread to morphogen signaling to enable scale invariant patterning of the ventral neural tube",
                              journal: "bioRxiv",
                              year: "2023",
                              link: "https://www.biorxiv.org/content/10.1101/469239v2"
                         });

                         addCurrentResearchPublication({
                              authors: "Li X, Gordon P, Gaynes J, Fuller A, Ringuette R, Santiago C, Wallace V, Blackshaw S, Li P, Levine E",
                              title: "Lhx2 is a progenitor-intrinsic modulator of Sonic Hedgehog signaling during early retinal neurogenesis",
                              journal: "eLife",
                              year: "2022; 11:e78342",
                              pmid: "36459481"
                         });

                         addCurrentResearchPublication({
                              authors: "Kim JS, Pineda M, Li P",
                              title: "Reconstitution of morphogen signaling gradients in cultured cells",
                              journal: "Methods Mol Biol.",
                              year: "2021; 2258: 43-56",
                              pmid: "33340353"
                         });

                         addCurrentResearchPublication({
                              authors: "Schlissel G & Li P",
                              title: "Synthetic developmental biology: understanding through reconstitution",
                              journal: "Annu. Rev. Cell Dev. Biol.",
                              year: "2020; 36: 339-357",
                              pmid: "33021822"
                         });

                         addCurrentResearchPublication({
                              authors: "Li P & Elowitz MB",
                              title: "Communication codes in developmental signaling pathways",
                              journal: "Development",
                              year: "2019; 146(12): dev170977",
                              pmid: "31249008"
                         });

                         addCurrentResearchPublication({
                              authors: "Li P, Markson JS, Wang S, Chen S, Vachharajani V, Elowitz MB",
                              title: "Morphogen gradient reconstitution reveals Hedgehog pathway design principles",
                              journal: "Science",
                              year: "2018; 360(6388):543-548",
                              pmid: "29622726"
                         });

                         // Add Previous Publications
                         addPreviousPublication({
                              authors: "Lahvic JL, Ammerman M, Li P, Blair MC, Stillman ER, Fast EM, Robertson AL, Christodoulou C, Perlin JR, Yang S, Chiang N, Norris PC, Daily ML, Redfield SE, Chan IT, Chatrizeh M, Chase ME, Weis O, Zhou Y, Serhan CN, Zon LI",
                              title: "Specific oxylipins enhance vertebrate hematopoiesis via the receptor GPR132",
                              journal: "Proc Natl Acad Sci U S A",
                              year: "2018; 115(37):9252",
                              pmid: "30139917"
                         });

                         addPreviousPublication({
                              authors: "Li P, Lahvic J, Binder V, Pugach EK, Riley EB, Tamplin OJ, Panigrahy D, Bowman TV, Barrett FG, Heffner GC, McKinney-Freeman S, Schlaeger TM, Daley GQ, Zeldin DC, Zon LI",
                              title: "Epoxyeicosatrienoic acids enhance embryonic haematopoiesis and adult marrow engraftment",
                              journal: "Nature",
                              year: "2015; 523(7561):468-71",
                              pmid: "26201599"
                         });

                         addPreviousPublication({
                              authors: "Tamplin OJ, Durand EM, Carr LA, Childs SJ, Hagedorn EJ, Li P, Yzaguirre AD, Speck NA, Zon LI",
                              title: "Hematopoietic stem cell arrival triggers dynamic remodeling of the perivascular niche",
                              journal: "Cell",
                              year: "2015; 160(1-2):241",
                              pmid: "25594182"
                         });

                         addPreviousPublication({
                              authors: "Tamplin OJ, White RM, Jing L, Kaufman CK, Lacadie SA, Li P, Taylor AM, Zon LI",
                              title: "Small molecule screening in zebrafish: swimming in potential drug therapies",
                              journal: "Wiley Interdiscip Rev Dev Biol.",
                              year: "2012; 1(3):459-68",
                              pmid: "23801494"
                         });

                         addPreviousPublication({
                              authors: "Zhang L, Alt C, Li P, White RM, Zon LI, Wei X, Lin CP",
                              title: "An optical platform for cell tracking in adult zebrafish",
                              journal: "Cytometry A.",
                              year: "2012; 81(2):176-82",
                              pmid: "22162445"
                         });

                         addPreviousPublication({
                              authors: "Trompouki E, Bowman TV, Lawton LN, Fan ZP, Wu DC, DiBiase A, Martin CS, Cech JN, Sessa AK, Leblanc JL, Li P, Durand EM, Mosimann C, Heffner GC, Daley GQ, Paulson RF, Young RA, Zon LI",
                              title: "Lineage regulators direct BMP and Wnt pathways to cell-specific programs during differentiation and regeneration",
                              journal: "Cell",
                              year: "2011; 147(3):577-89",
                              pmid: "22036566"
                         });

                         addPreviousPublication({
                              authors: "Mosimann C, Kaufman CK, Li P, Pugach EK, Tamplin OJ, Zon LI",
                              title: "Ubiquitous transgene expression and Cre-based recombination driven by the ubiquitin promoter in zebrafish",
                              journal: "Development",
                              year: "2011; 138(1):169-77",
                              pmid: "21138979"
                         });

                         addPreviousPublication({
                              authors: "Li P, Zon LI",
                              title: "Stem cell migration: a zebrafish model",
                              journal: "Methods Mol Biol.",
                              year: "2011; 750:157",
                              pmid: "21618090"
                         });

                         addPreviousPublication({
                              authors: "Li P, White RM, Zon LI",
                              title: "Transplantation in zebrafish",
                              journal: "Methods Cell Biol.",
                              year: "2011; 105:403",
                              pmid: "21951540"
                         });

                         addPreviousPublication({
                              authors: "Li P, Zon LI",
                              title: "Resolving the controversy about N‐Cadherin and Hematopoietic Stem Cells",
                              journal: "Cell Stem Cell.",
                              year: "2010; 6(3): 199-202",
                              pmid: "20207222"
                         });

                         addPreviousPublication({
                              authors: "Pugach EK, Li P, White R, Zon L",
                              title: "Retro-orbital injection in adult zebrafish",
                              journal: "JOVE",
                              year: "2009 (34)",
                              pmid: "19997061"
                         });

                         addPreviousPublication({
                              authors: "North TE, Goessling W, Peeters M, Li P, Ceol C, Lord AM, Weber GJ, Harris J, Cutting CC, Huang P, Dzierzak E, Zon LI",
                              title: "Hematopoietic stem cell development is dependent on blood flow",
                              journal: "Cell",
                              year: "2009; 137(4): 736",
                              pmid: "19450519"
                         });

                         addPreviousPublication({
                              authors: "Jiao W, Hong W, Li P, Sun S, Ma J, Qian M, Hu M, Chang Z",
                              title: "The dramatically increased chaperone activity of small heat-shot protein IbpB is retained for an extended period of time after the stress condition is removed",
                              journal: "Biochemical J.",
                              year: "2008; 410(1):63-70",
                              pmid: "17995456"
                         });

                         addPreviousPublication({
                              authors: "Jiao W, Li P, Zhang J, Zhang H, Chang Z",
                              title: "Small heat‐shock proteins function in the insoluble protein complex",
                              journal: "Biochem Biophys Res Commun.",
                              year: "2005; 335(1): 227",
                              pmid: "16055090"
                         });

                         addPreviousPublication({
                              authors: "Jiao W, Qian M, Li P, Zhao L, Chang Z",
                              title: "The essential role of the flexible termini in the temperature-responsiveness of the oligomeric state and chaperone-like activity for the polydisperse small heat shock protein IbpB from Escherichia coli",
                              journal: "J. Mol. Biol.",
                              year: "2005; 347(4):871-84",
                              pmid: "15769476"
                         });

                    } catch (err) {
                         console.error("Failed to load publication template:", err);
                    }
               })();

               // Mobile Menu Toggle
               const mobileToggle = document.getElementById("mobile-menu-toggle");
               const headerNav = document.getElementById("header-nav");

               if (mobileToggle && headerNav) {
                    mobileToggle.addEventListener("click", () => {
                         mobileToggle.classList.toggle("active");
                         headerNav.classList.toggle("active");
                    });
               }
          </script>
     </body>
</html>
